[project]
name = "refund-agent"
version = "0.1.0"
description = "AI-powered refund-approval workflow with tool-using agent, human approval, tests and evals"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-playwright>=0.5",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
addopts = "-ra"
markers = [
    "e2e: browser tests (need playwright browsers installed)",
    "eval: AI evaluation suite",
    "live: hits a real LLM provider (needs OPENROUTER_API_KEY)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
